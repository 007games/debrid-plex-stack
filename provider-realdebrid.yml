# Real-Debrid -> Zurg (WebDAV) -> rclone (FUSE) -> ./mnt/zurg
#
#   internet <── debrid_egress ── zurg ── debrid_internal (no internet) ── rclone ── ./mnt/zurg
#                                  │
#                          127.0.0.1:9999 (host only)
#
# rclone has no internet access and no ports; zurg is reachable only from rclone
# and the host's loopback.

networks:
  debrid_internal:
    driver: bridge
    internal: true

services:
  zurg:
    image: ${ZURG_IMAGE:-ghcr.io/debridmediamanager/zurg-testing:latest@sha256:9bde9836ea1e8495f0d7d892e3923ec72c6b6bb224d2e0755c9a84a09d21be17}
    container_name: zurg
    restart: unless-stopped
    networks:
      - debrid_internal
      - debrid_egress
    ports:
      - "127.0.0.1:9999:9999"
    volumes:
      - ./zurg/config.yml:/app/config.yml:ro
      - ./zurg/data:/app/data
    environment:
      - TZ=${TZ:-UTC}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  rclone:
    image: ${RCLONE_IMAGE:-rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5}
    container_name: rclone
    restart: unless-stopped
    networks:
      - debrid_internal
    devices:
      - /dev/fuse:/dev/fuse
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
      - no-new-privileges:true
    volumes:
      - ./rclone/rclone.conf:/config/rclone/rclone.conf:ro
      - ./rclone/cache:/cache
      - type: bind
        source: ./mnt
        target: /data
        bind:
          propagation: rshared
    command:
      - mount
      - "zurg:"
      - /data/zurg
      - --config=/config/rclone/rclone.conf
      - --cache-dir=/cache
      - --read-only
      - --allow-other
      - --uid=${PUID:-1000}
      - --gid=${PGID:-1000}
      - --umask=022
      - --dir-cache-time=10s
      - --vfs-cache-mode=full
      - --vfs-cache-max-size=${RCLONE_CACHE_MAX:-20G}
      - --vfs-cache-max-age=6h
      - --vfs-read-chunk-size=32M
      - --vfs-read-ahead=128M
      - --buffer-size=64M
      - --log-level=NOTICE
    healthcheck:
      test: ["CMD-SHELL", "grep -q ' /data/zurg fuse.rclone ' /proc/mounts && timeout 10 ls /data/zurg >/dev/null"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    mem_limit: 1g
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      - zurg

  plex:
    depends_on:
      rclone:
        condition: service_healthy
