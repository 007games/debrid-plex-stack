# Base: Plex + networks. The debrid provider comes from a second file, chosen via
# COMPOSE_FILE in .env (written by install.sh):
#
#   provider-realdebrid.yml   Real-Debrid -> Zurg -> rclone -> ./mnt/zurg
#   provider-torbox.yml       TorBox -> TorBox Media Center -> ./mnt/torbox
#   compose.gpu.yml           optional, adds /dev/dri for hardware transcoding
#
#   LAN ── ${LAN_IP}:32400 ── plex_lan ── plex <── ./mnt (read-only, rslave) <── provider mount
#
# Plex has no network path to the provider containers; it only reads the mount.
# Start with scripts/boot.sh.

name: debrid

networks:
  debrid_egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
  plex_lan:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        # Fixed so Plex's "LAN Networks" can include the gateway: some hosts
        # (e.g. Synology) masquerade LAN clients as this address.
        - subnet: ${PLEX_SUBNET:-172.30.0.0/24}
          gateway: ${PLEX_GATEWAY:-172.30.0.1}

services:
  plex:
    image: ${PLEX_IMAGE:-lscr.io/linuxserver/plex:1.43.4.10903-e5521bd8c-ls327@sha256:06e07af2851e6a822e89062b148435495dd794d6d5aaf36247dee05fb3dcc4b8}
    container_name: plex
    restart: unless-stopped
    networks:
      - plex_lan
    ports:
      - "${LAN_IP:?set LAN_IP in .env}:32400:32400/tcp"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      - ./plex/config:/config
      - type: tmpfs
        target: /transcode
        tmpfs:
          size: 4294967296
      - type: bind
        source: ./mnt
        target: /mnt
        read_only: true
        bind:
          propagation: rslave
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
